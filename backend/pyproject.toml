[project]
name = "studyspot-backend"
version = "0.5.0"
description = "StudySpot persistent campus data API"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.38,<2.1",
 "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "geoalchemy2>=0.17,<1",
 "httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
 "redis>=5,<8",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "python-dotenv>=1,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
